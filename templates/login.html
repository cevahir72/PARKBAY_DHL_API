<!DOCTYPE html>
<head>
    <title>parkbey</title>
    <meta charset="UTF-8" />
    <meta http-equiv="content-type" content="text/html; charset=ISO-8859-1" />
    <meta name="description" content="Dev: Aşkın PINAR. .">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="auth-layout">
    <div class="toast-container position-fixed top-0 end-0 p-3">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="toast text-bg-{{ category }} border-0 mb-2" role="alert">
            <div class="d-flex">
              <div class="toast-body">
                {{ message }}
              </div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
          </div>
        {% endfor %}
      {% endwith %}
    </div>


  <div class="login-page">
    <div class="login-card">

      <h1>parkbey</h1>
      <p>Giriş yapmak için bilgileri girin</p>

        <form action="{{ url_for('login') }}" method="post">
          <div class="form-group">
            <label for="email">E-posta</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="ornek@mail.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Şifre</label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="••••••••"
              required
            />
          </div>

          <button type="submit" class="btn-primary">Giriş Yap</button>
        </form>


      <div class="login-footer">
        <a href="#">Şifremi unuttum</a>
        <span>•</span>
        <a href="#">Kayıt Ol</a>
      </div>

    </div>
  </div>
<footer class="site-footer">
  <div class="footer-container">
    <div class="footer-left">
      <div class="footer-logo">derincode</div>
      <span>© 2026 Tüm hakları saklıdır.</span>
    </div>

    <div class="footer-right">
      <a href="{{ url_for('api_docs') }}">API Dokümantasyonu</a>
    </div>
  </div>
</footer>

<script>
  document.querySelectorAll('.toast').forEach(toastEl => {
    new bootstrap.Toast(toastEl, { delay: 4000 }).show();
  });
</script>




</body>
